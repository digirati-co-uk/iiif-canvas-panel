<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Enabling zoom events</title>
  <p>Click the canvas panel to enable zoom preset</p>

  <canvas-panel
    id="cp"
    preset="responsive"
    click-to-enable-zoom="true"
    canvas-id="https://digirati-co-uk.github.io/wunder/canvases/0"
    manifest-id="https://digirati-co-uk.github.io/wunder.json"
  >
  </canvas-panel>
  <script type="module" src="./src/index.js"></script>
</html>
