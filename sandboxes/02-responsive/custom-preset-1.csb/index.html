<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Responsive JSON config</title>
  <script id="my-preset" type="application/json">
    {
      "styleId": "css",
      "height": 300,
      "canvasId": "https://iiif.wellcomecollection.org/presentation/b28929780/canvases/b28929780_0006.jp2",
      "media": {
        "(min-width: 800px)": {
          "canvasId": "https://iiif.wellcomecollection.org/presentation/b28929780/canvases/b28929780_0004.jp2",
          "height": 500
        },
        "(min-width: 1200px)": {
          "height": 700
        }
      }
    }
  </script>
  <canvas-panel
    preset="#my-preset"
    manifest-id="https://iiif.wellcomecollection.org/presentation/b28929780"
  >
  </canvas-panel>
  <script type="module" src="./src/index.js"></script>
</html>
